<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現代質感倒數計時器</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Tone.js 用於產生提示音效 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- 引入 Google Fonts (Inter & JetBrains Mono) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .font-mono-num {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }
        /* 自訂輸入框隱藏上下箭頭 */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        /* 進度環平滑過渡 */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.3s linear, stroke 0.3s ease;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

    <!-- 主容器 -->
    <main class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
        
        <!-- 頂部裝飾光暈 -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- 標題列 -->
        <header class="flex items-center justify-between mb-6 relative z-10">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-xl bg-indigo-500/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                    </svg>
                </div>
                <h1 class="text-lg font-semibold tracking-tight text-slate-100">專注倒數計時</h1>
            </div>
            
            <!-- 音效開關按鈕 -->
            <button id="soundToggle" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-800 text-slate-300 hover:text-white border border-slate-700/50 transition-all" title="切換提示音效">
                <svg id="soundOnIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                </svg>
                <svg id="soundOffIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
                </svg>
            </button>
        </header>

        <!-- 圓形進度條與時間顯示區 -->
        <div class="relative flex items-center justify-center my-6">
            <svg class="w-64 h-64 sm:w-72 sm:h-72" viewBox="0 0 260 260">
                <!-- 背景軌道 -->
                <circle
                    class="text-slate-800"
                    stroke-width="8"
                    stroke="currentColor"
                    fill="transparent"
                    r="116"
                    cx="130"
                    cy="130"
                />
                <!-- 動態進度條 -->
                <circle
                    id="progressCircle"
                    class="progress-ring__circle text-indigo-500"
                    stroke-width="8"
                    stroke-dasharray="728.85"
                    stroke-dashoffset="0"
                    stroke-linecap="round"
                    stroke="currentColor"
                    fill="transparent"
                    r="116"
                    cx="130"
                    cy="130"
                />
            </svg>

            <!-- 中央時間顯示 / 輸入面板 -->
            <div class="absolute inset-0 flex flex-col items-center justify-center">
                <!-- 狀態標籤 -->
                <span id="statusBadge" class="text-xs font-medium uppercase tracking-widest text-indigo-400 mb-2 bg-indigo-500/10 px-3 py-1 rounded-full border border-indigo-500/20">
                    準備就緒
                </span>

                <!-- 倒數數字顯示 (執行與暫停時顯示) -->
                <div id="timeDisplay" class="font-mono-num text-4xl sm:text-5xl font-bold tracking-tight text-white">
                    05:00
                </div>

                <!-- 時間設定輸入框 (閒置時可點擊編輯) -->
                <div id="timeInputs" class="hidden flex items-center justify-center gap-1 text-white">
                    <div class="flex flex-col items-center">
                        <input type="number" id="inputHours" min="0" max="99" value="0" class="font-mono-num w-14 text-center text-3xl font-bold bg-slate-800/90 border border-slate-700 rounded-xl py-1 focus:outline-none focus:border-indigo-500" aria-label="小時">
                        <span class="text-[10px] text-slate-400 mt-1">時</span>
                    </div>
                    <span class="text-2xl font-bold text-slate-500 pb-4">:</span>
                    <div class="flex flex-col items-center">
                        <input type="number" id="inputMinutes" min="0" max="59" value="5" class="font-mono-num w-14 text-center text-3xl font-bold bg-slate-800/90 border border-slate-700 rounded-xl py-1 focus:outline-none focus:border-indigo-500" aria-label="分鐘">
                        <span class="text-[10px] text-slate-400 mt-1">分</span>
                    </div>
                    <span class="text-2xl font-bold text-slate-500 pb-4">:</span>
                    <div class="flex flex-col items-center">
                        <input type="number" id="inputSeconds" min="0" max="59" value="0" class="font-mono-num w-14 text-center text-3xl font-bold bg-slate-800/90 border border-slate-700 rounded-xl py-1 focus:outline-none focus:border-indigo-500" aria-label="秒">
                        <span class="text-[10px] text-slate-400 mt-1">秒</span>
                    </div>
                </div>

                <!-- 切換編輯按鈕 -->
                <button id="editTimeBtn" class="mt-3 text-xs text-slate-400 hover:text-indigo-400 flex items-center gap-1 transition-colors py-1 px-2 rounded-lg hover:bg-slate-800/50">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
                    </svg>
                    <span id="editBtnText">自訂時間</span>
                </button>
            </div>
        </div>

        <!-- 快速預設時間按鈕 -->
        <div id="presetContainer" class="grid grid-cols-4 gap-2 mb-6">
            <button data-seconds="60" class="preset-btn py-2 px-2 rounded-xl bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 text-xs font-medium text-slate-300 hover:text-white transition-all active:scale-95">
                1 分鐘
            </button>
            <button data-seconds="300" class="preset-btn py-2 px-2 rounded-xl bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 text-xs font-medium text-slate-300 hover:text-white transition-all active:scale-95">
                5 分鐘
            </button>
            <button data-seconds="900" class="preset-btn py-2 px-2 rounded-xl bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 text-xs font-medium text-slate-300 hover:text-white transition-all active:scale-95">
                15 分鐘
            </button>
            <button data-seconds="1500" class="preset-btn py-2 px-2 rounded-xl bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 text-xs font-medium text-slate-300 hover:text-white transition-all active:scale-95">
                25 分鐘
            </button>
        </div>

        <!-- 主要控制按鈕列 -->
        <div class="flex items-center gap-3">
            <button id="startPauseBtn" class="flex-1 py-3.5 px-6 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white font-semibold shadow-lg shadow-indigo-600/25 flex items-center justify-center gap-2 transition-all">
                <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
                <svg id="pauseIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 fill-current hidden" viewBox="0 0 24 24">
                    <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
                </svg>
                <span id="startPauseText">開始倒數</span>
            </button>

            <button id="resetBtn" class="p-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 active:scale-[0.98] text-slate-300 hover:text-white border border-slate-700/50 transition-all" title="重設時間">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
                </svg>
            </button>
        </div>

        <!-- 訊息通知橫幅 (替代 alert) -->
        <div id="messageBox" class="hidden mt-5 p-3.5 rounded-2xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-sm flex items-center justify-between animate-fade-in">
            <div class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-emerald-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
                <span id="messageText">時間到！倒數已完成。</span>
            </div>
            <button id="closeMessageBtn" class="text-emerald-400 hover:text-emerald-200 p-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
    </main>

    <script>
        /**
         * 倒數計時器核心邏輯
         */
        document.addEventListener('DOMContentLoaded', () => {
            // DOM 元素參照
            const timeDisplay = document.getElementById('timeDisplay');
            const timeInputs = document.getElementById('timeInputs');
            const inputHours = document.getElementById('inputHours');
            const inputMinutes = document.getElementById('inputMinutes');
            const inputSeconds = document.getElementById('inputSeconds');
            const editTimeBtn = document.getElementById('editTimeBtn');
            const editBtnText = document.getElementById('editBtnText');
            
            const startPauseBtn = document.getElementById('startPauseBtn');
            const startPauseText = document.getElementById('startPauseText');
            const playIcon = document.getElementById('playIcon');
            const pauseIcon = document.getElementById('pauseIcon');
            const resetBtn = document.getElementById('resetBtn');
            
            const statusBadge = document.getElementById('statusBadge');
            const progressCircle = document.getElementById('progressCircle');
            const presetBtns = document.querySelectorAll('.preset-btn');
            
            const soundToggle = document.getElementById('soundToggle');
            const soundOnIcon = document.getElementById('soundOnIcon');
            const soundOffIcon = document.getElementById('soundOffIcon');
            
            const messageBox = document.getElementById('messageBox');
            const messageText = document.getElementById('messageText');
            const closeMessageBtn = document.getElementById('closeMessageBtn');

            // 圓形進度條周長計算 (2 * PI * r, r=116)
            const radius = 116;
            const circumference = 2 * Math.PI * radius;
            progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
            progressCircle.style.strokeDashoffset = 0;

            // 計時器狀態變數
            let totalSeconds = 300;      // 預設 5 分鐘
            let remainingSeconds = 300;
            let timerInterval = null;
            let isRunning = false;
            let isEditing = false;
            let isSoundEnabled = true;

            // 格式化時間為 HH:MM:SS 或 MM:SS
            function formatTime(sec) {
                const hrs = Math.floor(sec / 3600);
                const mins = Math.floor((sec % 3600) / 60);
                const secs = sec % 60;

                const pad = (num) => String(num).padStart(2, '0');
                if (hrs > 0) {
                    return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
                }
                return `${pad(mins)}:${pad(secs)}`;
            }

            // 更新畫面顯示與進度環
            function updateDisplay() {
                timeDisplay.textContent = formatTime(remainingSeconds);
                document.title = isRunning ? `(${formatTime(remainingSeconds)}) 倒數計時器` : '現代質感倒數計時器';

                // 更新進度環
                const progress = totalSeconds > 0 ? remainingSeconds / totalSeconds : 0;
                const offset = circumference - progress * circumference;
                progressCircle.style.strokeDashoffset = offset;

                // 最後 10 秒變色提醒
                if (remainingSeconds <= 10 && remainingSeconds > 0 && isRunning) {
                    progressCircle.classList.remove('text-indigo-500', 'text-emerald-500');
                    progressCircle.classList.add('text-amber-500');
                } else if (remainingSeconds === 0) {
                    progressCircle.classList.remove('text-indigo-500', 'text-amber-500');
                    progressCircle.classList.add('text-emerald-500');
                } else {
                    progressCircle.classList.remove('text-amber-500', 'text-emerald-500');
                    progressCircle.classList.add('text-indigo-500');
                }
            }

            // 播放提示音效 (使用 Tone.js 合成和弦鈴聲)
            async function playAlarmSound() {
                if (!isSoundEnabled) return;
                try {
                    await Tone.start();
                    const synth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: "triangle" },
                        envelope: {
                            attack: 0.02,
                            decay: 0.3,
                            sustain: 0.2,
                            release: 1
                        }
                    }).toDestination();

                    const now = Tone.now();
                    synth.triggerAttackRelease(["C5", "E5", "G5"], "8n", now);
                    synth.triggerAttackRelease(["E5", "G5", "C6"], "4n", now + 0.25);
                    synth.triggerAttackRelease(["G5", "C6", "E6"], "2n", now + 0.55);
                } catch (e) {
                    console.warn("音效播放受限:", e);
                }
            }

            // 顯示訊息提示框
            function showMessage(text, isError = false) {
                messageText.textContent = text;
                messageBox.classList.remove('hidden', 'bg-emerald-500/15', 'border-emerald-500/30', 'text-emerald-300', 'bg-rose-500/15', 'border-rose-500/30', 'text-rose-300');
                if (isError) {
                    messageBox.classList.add('bg-rose-500/15', 'border-rose-500/30', 'text-rose-300');
                } else {
                    messageBox.classList.add('bg-emerald-500/15', 'border-emerald-500/30', 'text-emerald-300');
                }
            }

            function hideMessage() {
                messageBox.classList.add('hidden');
            }

            // 切換編輯模式
            function toggleEditMode(forceState = null) {
                if (isRunning) return;
                isEditing = forceState !== null ? forceState : !isEditing;

                if (isEditing) {
                    // 填入目前剩餘時間到輸入框
                    inputHours.value = Math.floor(remainingSeconds / 3600);
                    inputMinutes.value = Math.floor((remainingSeconds % 3600) / 60);
                    inputSeconds.value = remainingSeconds % 60;

                    timeDisplay.classList.add('hidden');
                    timeInputs.classList.remove('hidden');
                    editBtnText.textContent = '確認設定';
                    statusBadge.textContent = '設定時間';
                    inputMinutes.focus();
                } else {
                    // 讀取輸入框並驗證
                    let h = Math.max(0, Math.min(99, parseInt(inputHours.value) || 0));
                    let m = Math.max(0, Math.min(59, parseInt(inputMinutes.value) || 0));
                    let s = Math.max(0, Math.min(59, parseInt(inputSeconds.value) || 0));

                    const newTotal = h * 3600 + m * 60 + s;
                    if (newTotal > 0) {
                        totalSeconds = newTotal;
                        remainingSeconds = newTotal;
                        hideMessage();
                    } else {
                        showMessage('請設定大於 0 秒的時間。', true);
                    }

                    timeInputs.classList.add('hidden');
                    timeDisplay.classList.remove('hidden');
                    editBtnText.textContent = '自訂時間';
                    statusBadge.textContent = '準備就緒';
                    updateDisplay();
                }
            }

            // 開始計時
            function startTimer() {
                if (isEditing) {
                    toggleEditMode(false);
                }
                if (remainingSeconds <= 0) {
                    remainingSeconds = totalSeconds;
                }
                if (remainingSeconds <= 0) {
                    showMessage('請先設定倒數時間！', true);
                    return;
                }

                // 預先解鎖 Tone.js 音訊環境
                if (isSoundEnabled && Tone.context.state !== 'running') {
                    Tone.start().catch(() => {});
                }

                hideMessage();
                isRunning = true;
                updateControlsUI();

                const endTime = Date.now() + remainingSeconds * 1000;

                timerInterval = setInterval(() => {
                    const now = Date.now();
                    const diff = Math.ceil((endTime - now) / 1000);

                    if (diff <= 0) {
                        remainingSeconds = 0;
                        updateDisplay();
                        completeTimer();
                    } else {
                        remainingSeconds = diff;
                        updateDisplay();
                    }
                }, 200);
            }

            // 暫停計時
            function pauseTimer() {
                clearInterval(timerInterval);
                isRunning = false;
                updateControlsUI();
                statusBadge.textContent = '已暫停';
            }

            // 計時完成
            function completeTimer() {
                clearInterval(timerInterval);
                isRunning = false;
                updateControlsUI();
                statusBadge.textContent = '計時完成';
                playAlarmSound();
                showMessage('時間到！倒數計時已完成。');
            }

            // 重設計時器
            function resetTimer() {
                clearInterval(timerInterval);
                isRunning = false;
                if (isEditing) {
                    toggleEditMode(false);
                }
                remainingSeconds = totalSeconds;
                hideMessage();
                updateControlsUI();
                statusBadge.textContent = '準備就緒';
                updateDisplay();
            }

            // 更新按鈕狀態外觀
            function updateControlsUI() {
                if (isRunning) {
                    startPauseBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-500', 'shadow-indigo-600/25');
                    startPauseBtn.classList.add('bg-amber-600', 'hover:bg-amber-500', 'shadow-amber-600/25');
                    startPauseText.textContent = '暫停';
                    playIcon.classList.add('hidden');
                    pauseIcon.classList.remove('hidden');
                    statusBadge.textContent = '計時中...';
                    editTimeBtn.classList.add('opacity-40', 'pointer-events-none');
                } else {
                    startPauseBtn.classList.remove('bg-amber-600', 'hover:bg-amber-500', 'shadow-amber-600/25');
                    startPauseBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-500', 'shadow-indigo-600/25');
                    startPauseText.textContent = remainingSeconds < totalSeconds && remainingSeconds > 0 ? '繼續倒數' : '開始倒數';
                    playIcon.classList.remove('hidden');
                    pauseIcon.classList.add('hidden');
                    editTimeBtn.classList.remove('opacity-40', 'pointer-events-none');
                }
            }

            // 事件綁定
            startPauseBtn.addEventListener('click', () => {
                if (isRunning) {
                    pauseTimer();
                } else {
                    startTimer();
                }
            });

            resetBtn.addEventListener('click', resetTimer);

            editTimeBtn.addEventListener('click', () => toggleEditMode());

            // 按 Enter 鍵確認自訂時間
            [inputHours, inputMinutes, inputSeconds].forEach(input => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        toggleEditMode(false);
                    }
                });
            });

            // 快速預設時間按鈕
            presetBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    if (isRunning) {
                        pauseTimer();
                    }
                    if (isEditing) {
                        isEditing = false;
                        timeInputs.classList.add('hidden');
                        timeDisplay.classList.remove('hidden');
                        editBtnText.textContent = '自訂時間';
                    }
                    const sec = parseInt(btn.getAttribute('data-seconds'), 10);
                    totalSeconds = sec;
                    remainingSeconds = sec;
                    hideMessage();
                    statusBadge.textContent = '準備就緒';
                    updateControlsUI();
                    updateDisplay();
                });
            });

            // 音效開關
            soundToggle.addEventListener('click', () => {
                isSoundEnabled = !isSoundEnabled;
                if (isSoundEnabled) {
                    soundOnIcon.classList.remove('hidden');
                    soundOffIcon.classList.add('hidden');
                } else {
                    soundOnIcon.classList.add('hidden');
                    soundOffIcon.classList.remove('hidden');
                }
            });

            // 關閉訊息框
            closeMessageBtn.addEventListener('click', hideMessage);

            // 初始化畫面
            updateDisplay();
        });
    </script>
</body>
</html>
